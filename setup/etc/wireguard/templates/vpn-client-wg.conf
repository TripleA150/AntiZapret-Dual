[Interface]
PrivateKey = ${CLIENT_PRIVATE_KEY}
#noipv6#Address = ${CLIENT_IP}/32
#ipv6#Address = ${CLIENT_IP}/32, ${CLIENT_IP6}/128
DNS = 1.1.1.1, 1.0.0.1

[Peer]
PublicKey = ${PUBLIC_KEY}
PresharedKey = ${CLIENT_PRESHARED_KEY}
Endpoint = ${SERVER_HOST}:51080
#noipv6#AllowedIPs = 0.0.0.0/0
#ipv6#AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 15
